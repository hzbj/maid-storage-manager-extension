plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.142'
}

group = mod_group_id
version = mod_version

base {
    archivesName = "${minecraft_version}-${mod_id}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { name = 'AliyunPublicMirror'; url = 'https://maven.aliyun.com/repository/public' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    maven { url = 'https://maven.shedaniel.me/' }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
    testCompileOnly.extendsFrom compileOnly
    testRuntimeOnly.extendsFrom localRuntime
}

dependencies {
    compileOnly 'maven.modrinth:5sIJPqAj:RgLYYPvs'
    localRuntime 'maven.modrinth:5sIJPqAj:RgLYYPvs'
    compileOnly 'maven.modrinth:R0bDWFAW:Dbjwcs2u'
    localRuntime 'maven.modrinth:R0bDWFAW:Dbjwcs2u'
    compileOnly 'maven.modrinth:QHB4kBBS:3tvArxwR'
    localRuntime 'maven.modrinth:QHB4kBBS:3tvArxwR'
    compileOnly 'me.shedaniel.cloth:cloth-config-neoforge:15.0.140'
    localRuntime 'me.shedaniel.cloth:cloth-config-neoforge:15.0.140'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

def replaceProperties = [
        minecraft_version: minecraft_version,
        minecraft_version_range: minecraft_version_range,
        neo_version: neo_version,
        neo_version_range: neo_version_range,
        loader_version_range: loader_version_range,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: mod_version,
        mod_authors: mod_authors,
        mod_description: mod_description
]

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    from('LICENSE')
    from('LICENSE-ASSETS.md')
    from('NOTICE')
    from('THIRD_PARTY_NOTICES.md')
    manifest {
        attributes([
                'Specification-Title': mod_id,
                'Specification-Vendor': mod_authors,
                'Specification-Version': '1',
                'Implementation-Title': project.name,
                'Implementation-Version': project.version,
                'Implementation-Vendor': mod_authors,
                'MixinConfigs': "${mod_id}.mixins.json"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// Gradle's Windows test worker can lose class-directory entries when the project path contains CJK.
def asciiTestRuntime = new File(System.getProperty('java.io.tmpdir'), "${mod_id}-neoforge-test-runtime")
tasks.register('prepareAsciiTestRuntime', Sync) {
    dependsOn tasks.named('testClasses')
    into asciiTestRuntime
    from(sourceSets.main.output) { into 'main' }
    from(sourceSets.test.output) { into 'test' }
}

tasks.named('test', Test).configure {
    dependsOn tasks.named('prepareAsciiTestRuntime')
    doFirst {
        classpath = files(
                new File(asciiTestRuntime, 'test'),
                new File(asciiTestRuntime, 'main')) + configurations.testRuntimeClasspath
    }
}
