modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/hzbj/maid-storage-manager-extension/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayURL="https://github.com/hzbj/maid-storage-manager-extension"
credits="Maid Storage Manager by xypp; Touhou Little Maid by TartaricAcid and contributors; Touhou Little Maid: Spell by yimeng261"
description='''${mod_description}'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies."${mod_id}"]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="touhou_little_maid"
type="required"
versionRange="[1.5.2,1.6)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="maid_storage_manager"
type="required"
versionRange="[1.15.6,1.16)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="touhou_little_maid_spell"
type="optional"
versionRange="[1.8.4,1.9)"
ordering="AFTER"
side="BOTH"

[[dependencies."${mod_id}"]]
modId="cloth_config"
type="optional"
versionRange="[15.0.140,16)"
ordering="AFTER"
side="CLIENT"

[[dependencies."${mod_id}"]]
modId="jei"
type="optional"
versionRange="[19,20)"
ordering="AFTER"
side="CLIENT"
